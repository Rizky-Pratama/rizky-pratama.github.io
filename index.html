<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Fullstack Developer Portfolio</title>
    <meta
      name="description"
      content="Fullstack developer building interfaces and the APIs behind them, from the first query to the last animation frame."
    />
    <link rel="canonical" href="https://example.com/" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Fullstack Developer" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Fullstack Developer Portfolio" />
    <meta
      property="og:description"
      content="Fullstack developer building interfaces and the APIs behind them, from the first query to the last animation frame."
    />
    <meta property="og:url" content="https://example.com/" />
    <meta property="og:site_name" content="Fullstack Developer Portfolio" />
    <meta property="og:image" content="https://example.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fullstack Developer Portfolio" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fullstack Developer Portfolio" />
    <meta
      name="twitter:description"
      content="Fullstack developer building interfaces and the APIs behind them, from the first query to the last animation frame."
    />
    <meta name="twitter:image" content="https://example.com/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Fonts are intentionally NOT preloaded here. Hand-written <link href> paths
      that point at package source files are not a documented Vite contract:
      Vite happens to rewrite them today, but relying on that risks shipping a
      bare source URL (a production 404) after any Vite upgrade. Instead
      src/style.css @imports the @fontsource-variable CSS, whose @font-face
      rules carry font-display: swap and hashed /assets/*.woff2 URLs, so the
      fonts load on first use with no manual tags to go stale.
    -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
