<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#0F172A" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Fonts are intentionally NOT preloaded here. Hand-written <link href> paths
      that point at package source files are not a documented Vite contract:
      Vite happens to rewrite them today, but relying on that risks shipping a
      bare source URL (a production 404) after any Vite upgrade. Instead
      src/style.css @imports the @fontsource-variable CSS, whose @font-face
      rules carry font-display: swap and hashed /assets/*.woff2 URLs, so the
      fonts load on first use with no manual tags to go stale.
    -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
