<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  role="img"
  aria-label="Fullstack Developer Portfolio"
>
  <title>Fullstack Developer Portfolio</title>

  <!-- Palette mirrors src/style.css @theme (dark-only). -->
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E293B" stop-opacity="0.55" />
      <stop offset="1" stop-color="#0F172A" stop-opacity="0" />
    </linearGradient>
    <pattern
      id="grid"
      width="40"
      height="40"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M40 0H0V40"
        fill="none"
        stroke="#243049"
        stroke-width="1"
      />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0F172A" />
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5" />
  <rect x="0" y="0" width="1200" height="630" fill="url(#sheen)" />

  <!-- Accent rule, top-left -->
  <rect x="80" y="84" width="72" height="6" rx="3" fill="#22C55E" />

  <!-- Mono eyebrow -->
  <text
    x="80"
    y="150"
    fill="#22C55E"
    font-family="'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="24"
    letter-spacing="2"
  >$ whoami</text>

  <!-- Headline: the role, as the big line -->
  <text
    x="80"
    y="300"
    fill="#F1F5F9"
    font-family="'Space Grotesk Variable', 'Space Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
    font-size="104"
    font-weight="600"
    letter-spacing="-2"
  >Fullstack Developer</text>

  <!-- Tagline -->
  <text
    x="80"
    y="378"
    fill="#94A3B8"
    font-family="'IBM Plex Sans Variable', 'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
    font-size="32"
  >Interfaces and the APIs behind them, built to hold up under production load.</text>

  <!-- Mono accent detail, bottom band -->
  <line
    x1="80"
    y1="498"
    x2="1120"
    y2="498"
    stroke="#243049"
    stroke-width="1"
  />

  <text
    x="80"
    y="552"
    fill="#94A3B8"
    font-family="'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="22"
    letter-spacing="1"
  >Vue 3 · Tailwind · GSAP</text>

  <text
    x="1120"
    y="552"
    fill="#22C55E"
    text-anchor="end"
    font-family="'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="22"
    letter-spacing="1"
  >1200 x 630</text>
</svg>
