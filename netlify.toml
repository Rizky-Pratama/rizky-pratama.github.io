# Netlify build + cache configuration.
# The site is a single static page with no client router, so there are no
# SPA redirects here — Netlify serves dist/ directly (see README "Deploy").

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # vite@8 requires Node >= 20.19. Pin the build image explicitly so the
  # deploy does not depend on Netlify's default runtime.
  NODE_VERSION = "20.19.0"

# Hashed, content-addressed build output: safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Generated chip icons — served from public/icons/, replaced only on redeploy.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Committed webp photography under public/images/.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The HTML entry point must always be revalidated so a new deploy is picked up.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
